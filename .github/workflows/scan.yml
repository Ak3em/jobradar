name: scan
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
  # Saving a resume (or editing config) re-scans right away
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scraper/**"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scraper/scrape.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Commit data
        run: |
          git config user.name "jobradar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then git commit -m "Update jobs" && git pull --rebase && git push; fi
  # A push made with GITHUB_TOKEN never triggers other workflows, so deploy from here
  deploy:
    needs: scan
    uses: ./.github/workflows/pages.yml
