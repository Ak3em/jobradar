<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F4EF" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)">
<title>JobRadar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/tokens.css"><link rel="stylesheet" href="styles.css">
</head><body>
<header class="bar"><div><b class="brand">JobRadar</b><span id="scan" class="muted"></span></div>
<div class="acts" style="margin:0"><button class="btn" data-a="add" aria-label="Add a job">+<span>Add job</span></button><button class="btn" id="refresh" data-a="refresh" aria-label="Refresh jobs"></button></div></header>
<nav id="nav" aria-label="Sections"></nav>
<main id="app" class="wrap" aria-live="polite"></main>
<div id="toast" role="status"><span id="tmsg"></span><button class="btn" id="undo">Undo</button></div>
<dialog id="dlg"></dialog>
<script type="module" src="app.js"></script>
</body></html>
